<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="3-layer corrugated board cross-section">
  <title>3-Layer Corrugated Board — Single Wall</title>
  <!-- top liner -->
  <rect x="40" y="116" width="320" height="12" rx="3" fill="#d8b184" />
  <!-- corrugated medium (flute) -->
  <path d="M 40 150
           q 20 -24 40 0 q 20 24 40 0
           q 20 -24 40 0 q 20 24 40 0
           q 20 -24 40 0 q 20 24 40 0
           q 20 -24 40 0 q 20 24 40 0"
        fill="none" stroke="#a8763f" stroke-width="5" stroke-linecap="round" />
  <!-- bottom liner -->
  <rect x="40" y="172" width="320" height="12" rx="3" fill="#d8b184" />
  <text x="360" y="282" text-anchor="end" fill="#7a5230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.5" font-weight="600">3-LAYER</text>
</svg>
